# Netlify builds on every commit with `npm run build`. GitHub Actions only
# fetches/parses DayZ-Script-Diff and commits data/ when that repo changes,
# which is what triggers a deploy for a new official build.

[build]
  publish = "dist"
  command = "npm run build"

# Default NFT tracing follows ROOT/fs in src/util.js and ships data/ + .cache/
# with the workshop function (250 MB upload limit).
[functions]
  node_bundler = "esbuild"
  included_files = ["!data/**", "!.cache/**", "!dist/**"]

[[redirects]]
  from = "/api/workshop"
  to = "/.netlify/functions/workshop"
  status = 200

# The old beta Netlify project builds from this repo too. Scoping `from` to its
# hostname retires that URL without touching diff.yadz.app; `force` is required
# so the redirect wins over files that exist in dist/.
[[redirects]]
  from = "https://beta-dayz-scripts.netlify.app/*"
  to = "https://diff.yadz.app/:splat"
  status = 301
  force = true
