# Netlify builds on every commit with `npm run build`. GitHub Actions only
# fetches/parses DayZ-Script-Diff and commits data/ when that repo changes,
# which is what triggers a deploy for a new official build.

[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/workshop"
  to = "/.netlify/functions/workshop"
  status = 200
